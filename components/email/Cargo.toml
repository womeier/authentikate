[package]
name = "authentikate-email"
version = "0.1.0"
edition = "2021"
publish = false
description = "Interchangeable stdout and localhost SMTP WebAssembly email components"

[lib]
crate-type = ["cdylib"]

[features]
default = ["stdout"]
stdout = []
smtp = []

[dependencies]
serde_json = "1"
wasi = "=0.14.2"
wit-bindgen = "0.46"
