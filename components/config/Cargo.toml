[package]
name = "authentikate-config"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
zeroize = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasi = "=0.14.2"
wit-bindgen = "0.46"
