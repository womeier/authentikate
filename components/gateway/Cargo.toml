[package]
name = "authentikate-gateway"
version = "0.1.0"
edition = "2021"
publish = false
description = "WebAssembly HTTP gateway: routing, origin policy and static assets for the Rocq service"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.57.1", features = ["async-spawn"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
