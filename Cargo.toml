[workspace]
members = ["host", "components/crypto/argon2", "components/crypto/hmac", "components/email", "components/gateway", "components/storage"]
default-members = ["host"]
resolver = "3"

[profile.dev]
debug = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
