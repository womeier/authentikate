name: Nix CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: nix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: womeier
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          extraPullNames: coq,coq-community,math-comp
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Build development environment including MetaRocq and CertiRocq
        run: nix develop --profile dev-profile -c true

      # The derivation checks Rocq proofs, primitive adapters and extracted runtime.
      - name: Build and test service component
        run: nix build --print-build-logs

      - name: Build composed application and stock Wasmtime launcher
        run: nix build --print-build-logs .#authentikate-app-component .#authentikate-local --out-link app-component

      - name: Print component interface
        run: |
          mkdir -p build
          nix develop --command wasm-tools component wit result/authentikate.component.wasm | tee build/authentikate.component.wit

      - name: Prepare component for HTTP tests
        run: |
          mkdir -p build
          cp result/authentikate.component.wasm build/

      - name: Test Rust crypto providers
        run: |
          nix develop --command cargo test --locked -p authentikate-argon2 -p authentikate-hmac

      - name: Test stdout email component
        run: nix develop --command make test-email-stdout

      - name: Compose actual Rust providers and test stock Wasmtime HTTP
        run: |
          nix develop --command make crypto-components test-app
          nix develop --command cargo fmt --all -- --check
          nix flake check --print-build-logs
          nix develop --command cargo test --locked -p authentikate-config -p authentikate-gateway -p authentikate-storage

      - uses: actions/upload-artifact@v4
        with:
          name: authentikate-wasm
          path: |
            result/*.wasm
            build/authentikate.component.wit
            build/email-stdout.component.wasm
            build/argon2.component.wasm
            build/hmac.component.wasm
            build/app.component.wasm
            build/config.component.wasm
            build/storage.component.wasm
          if-no-files-found: error
