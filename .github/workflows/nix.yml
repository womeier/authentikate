name: Nix CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: nix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: womeier
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          extraPullNames: coq,coq-community,math-comp
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Build development environment including MetaRocq and CertiRocq
        run: nix develop --profile dev-profile -c true

      - name: Cache development environment
        if: github.event_name != 'pull_request'
        run: cachix push womeier dev-profile

      # The derivation checks Rocq proofs, primitive adapters and extracted runtime.
      - name: Build and test service component
        run: nix build --print-build-logs

      - name: Print component interface
        run: |
          mkdir -p build
          nix develop --command wasm-tools component wit result/authentikate.component.wasm | tee build/authentikate.component.wit

      - name: Prepare component for HTTP tests
        run: |
          mkdir -p build
          cp result/authentikate.component.wasm build/

      - name: Install demo dependencies
        run: nix develop --command npm ci --no-audit --no-fund

      - name: Test Rust crypto providers
        run: |
          nix develop --command cargo test --locked --manifest-path crypto/argon2/Cargo.toml
          nix develop --command cargo test --locked --manifest-path crypto/ed25519/Cargo.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Test stdout email component
        # Use rustup's compiler and installed Wasm target, with Nix's component tools.
        run: nix develop --command bash -c 'PATH="$HOME/.cargo/bin:$PATH" make test-email-stdout'

      - name: Test component over HTTP
        run: nix develop --command npm run test:web

      - uses: actions/upload-artifact@v4
        with:
          name: authentikate-wasm
          path: |
            result/*.wasm
            build/authentikate.component.wit
            build/email-stdout.component.wasm
          if-no-files-found: error
