[package]
name = "authentikate-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
anyhow = "1"
getrandom = { version = "0.3", features = ["std"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
url = "2"
wasmtime = { version = "50.0.0", default-features = false, features = ["anyhow", "component-model", "cranelift", "runtime", "std", "parallel-compilation"] }
wasmtime-wasi = { version = "50.0.0", default-features = false, features = ["p2"] }
wasmtime-wasi-http = { version = "50.0.0", default-features = false, features = ["p2"] }
zeroize = "1"

[dev-dependencies]
base64 = "0.22"
hmac = "0.12"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
