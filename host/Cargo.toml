[package]
name = "authentikate-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
anyhow = "1"
axum = "0.8"
getrandom = { version = "0.3", features = ["std"] }
http-body-util = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
wasmtime = { version = "50.0.0", default-features = false, features = ["anyhow", "component-model", "cranelift", "runtime", "std", "parallel-compilation"] }
wasmtime-wasi = { version = "50.0.0", default-features = false, features = ["p2"] }
zeroize = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
